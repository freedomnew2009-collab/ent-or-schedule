# Deploy Code.gs (และ index.html สำรอง) ขึ้น Google Apps Script อัตโนมัติ
# ทุกครั้งที่ merge เข้า main — อัพเดท deployment เดิม ลิงก์ /exec จึงไม่เปลี่ยน
#
# ตั้งค่าครั้งเดียว (Settings → Secrets and variables → Actions → New repository secret):
#   CLASP_SCRIPT_ID = Script ID (Apps Script → ⚙️ Project Settings → IDs → Script ID)
#   CLASPRC_JSON    = เนื้อหาไฟล์ ~/.clasprc.json หลังรัน `npx @google/clasp@2.4.2 login` บนคอมตัวเอง
# และเปิด Apps Script API ที่ https://script.google.com/home/usersettings
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - Code.gs
      - index.html
      - .github/workflows/deploy-apps-script.yml
  workflow_dispatch:

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
      # ID ของ deployment เดิม (ส่วนกลางของลิงก์ https://script.google.com/macros/s/<ID>/exec)
      DEPLOYMENT_ID: AKfycbweQIQj0GbscFla0SZvklfm38mMkSiJqzlpFNe3z19va-UUgJ_O0zE6lXdG9O8dx7kt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::ยังไม่ได้ตั้ง Secret CLASPRC_JSON / CLASP_SCRIPT_ID (ดูวิธีที่หัวไฟล์ workflow นี้)"
            exit 1
          fi
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          # รองรับไฟล์ login ทั้งของ clasp 2.x และ 3.x (3.x เก็บเป็น {"tokens":{"default":{...}}})
          # แปลงให้เป็นแบบที่ clasp 2.4.2 อ่านได้ — พิมพ์เฉพาะชื่อ key ไว้ตรวจ ไม่พิมพ์ค่า
          node -e '
            const fs=require("fs"),f=process.env.HOME+"/.clasprc.json";
            let j;try{j=JSON.parse(fs.readFileSync(f,"utf8").trim());}
            catch(e){console.log("::error::CLASPRC_JSON ไม่ใช่ JSON ที่ถูกต้อง — ต้อง copy เนื้อหาไฟล์ .clasprc.json ทั้งไฟล์ ตั้งแต่ { ถึง }");process.exit(1);}
            console.log("keys:",Object.keys(j).join(","));
            if(!j.token&&j.tokens){
              const t=j.tokens.default||j.tokens[Object.keys(j.tokens)[0]]||{};
              console.log("clasp 3 format, token keys:",Object.keys(t).join(","));
              j={token:{access_token:t.access_token,refresh_token:t.refresh_token,scope:t.scope,token_type:t.token_type||"Bearer",expiry_date:t.expiry_date||0},
                 oauth2ClientSettings:{clientId:t.client_id,clientSecret:t.client_secret,redirectUri:"http://localhost"},isLocalCreds:false};
              fs.writeFileSync(f,JSON.stringify(j));console.log("converted to clasp 2 format");
            }
            if(!j.token||!j.token.refresh_token){console.log("::error::ไม่พบ refresh_token ใน CLASPRC_JSON — รัน npx @google/clasp@2.4.2 login ใหม่ แล้วใส่ Secret ใหม่");process.exit(1);}'

      # ดึงโปรเจกต์ปัจจุบันลงมาก่อน — เก็บ appsscript.json (ค่าเว็บแอป/สิทธิ์/timezone) ของเดิมไว้
      # เพราะ clasp push จะแทนที่ไฟล์ทั้งโปรเจกต์ด้วยสิ่งที่อยู่ในโฟลเดอร์
      - name: Pull current project
        run: |
          mkdir gas && cd gas
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          echo "--- ไฟล์ในโปรเจกต์ตอนนี้ ---"; ls -1

      - name: Put new code in place
        run: |
          cd gas
          # ไฟล์โค้ดเดิมที่มี doGet (ชื่ออะไรก็ได้) คือ Code.gs เวอร์ชันเก่า — เอาออก กันประกาศตัวแปรซ้ำ
          for f in $(grep -l "function doGet" -- *.js *.gs 2>/dev/null || true); do
            echo "แทนที่ไฟล์โค้ดเดิม: $f"; rm -f "$f"
          done
          cp ../Code.gs Code.js
          # หน้าเว็บสำรอง (ใช้ตอนดึงจาก GitHub ไม่ได้) ให้ตรงกับเวอร์ชันล่าสุดด้วย
          if [ -f index.html ]; then cp ../index.html index.html; fi
          # ถ้า manifest ไม่มีค่าเว็บแอป deployment จะไม่เป็นเว็บแอป — เติมค่าเดิม (Execute as: Me, Anyone)
          node -e '
            const fs=require("fs");const m=JSON.parse(fs.readFileSync("appsscript.json","utf8"));
            if(!m.webapp){m.webapp={executeAs:"USER_DEPLOYING",access:"ANYONE_ANONYMOUS"};
              fs.writeFileSync("appsscript.json",JSON.stringify(m,null,2));console.log("added webapp config");}
            console.log(JSON.stringify(m.webapp));'

      - name: Push and update deployment
        run: |
          cd gas
          clasp push --force
          clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub ${GITHUB_SHA::7}"

      - name: Check live deployment
        run: |
          sleep 5
          OUT=$(curl -sSL "https://script.google.com/macros/s/$DEPLOYMENT_ID/exec?action=ping")
          echo "$OUT"
          EXPECT=$(grep -o "APP_VERSION = '[^']*'" Code.gs | cut -d"'" -f2)
          echo "$OUT" | grep -q "\"version\":\"$EXPECT\"" || { echo "::error::ping ไม่ได้เวอร์ชัน $EXPECT"; exit 1; }
